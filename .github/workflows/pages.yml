name: Deploy self-hosted landing page and docs

# This repository dogfoods its own package: the docs/ Docusaurus project is built by the shared
# pages.yml reusable workflow, then tools/Build-LandingPage.ps1 builds the landing page from the
# published package's generic README/CHANGELOG mode and merges it into docs/build. Pages serves
# docs/build from main; pull requests only build. See design/90-decisions.md.
#
# The site deploys to the GitHub Pages project subpath, which the shared workflow exports as
# PAGES_BASE_PATH and which matches `baseUrl` in docs/docusaurus.config.ts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pages.yml@v0
    with:
      working-directory: docs
      node-version: '22'
      # generate-changelog reads first-parent history for the whole repo.
      fetch-depth: 0
      output: build
      # The published package version the landing page is built with.
      env: LANDING_PAGE_VERSION=0.5.0
      post-build: tools/Build-LandingPage.ps1
